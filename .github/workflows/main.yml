name: CI/CD Pipeline - Build and Deploy to EC2

# Tự động kích hoạt khi có commit push lên branch main
on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CI - Build và Push Image lên Docker Hub
  # ==========================================
  build-and-push:
    name: CI - Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: production # <--- THÊM DÒNG NÀY (Thay 'production' bằng tên Environment bạn tạo trên GitHub)

    steps:
      # 1. Lấy code từ repository về runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Cấu hình Buildx giúp build image tối ưu hơn
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build Docker image và Push lên Docker Hub
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile # Trỏ đúng đường dẫn Dockerfile của bạn
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cenfra-ms:latest
            ${{ secrets.DOCKER_USERNAME }}/cenfra-ms:${{ github.sha }}

  # ==========================================
  # JOB 2: CD - SSH vào EC2 và Deploy
  # ==========================================
  deploy-to-ec2:
    name: CD - Deploy to EC2
    needs: build-and-push # Chỉ chạy sau khi Job CI hoàn thành
    runs-on: ubuntu-latest
    environment: production # <--- CẢ JOB NÀY CŨNG CẦN THÊM (Vì dùng EC2_HOST, EC2_USERNAME, EC2_SSH_KEY)

    steps:
      # SSH vào EC2 để thực hiện pull image mới và restart container
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Di chuyển tới thư mục chứa dự án trên EC2
            cd /home/ubuntu/app
            
            # 2. Pull image mới nhất vừa build ở bước CI về EC2
            docker compose pull
            
            # 3. Khởi động lại container ngầm (-d) bằng image mới
            docker compose up -d
            
            # 4. Dọn dẹp các Docker image cũ/không sử dụng để tránh đầy ổ cứng EC2
            docker image prune -f
